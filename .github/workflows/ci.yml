name: CI

on:
  pull_request:
  push:
    branches: [main, "epic/**"]

permissions:
  contents: read

jobs:
  backend:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Lint the setup and release scripts
        if: runner.os == 'Linux'
        run: shellcheck ../scripts/setup.sh ../scripts/release.sh ../scripts/smoke-test-wheel.sh

      - name: Set up framewise
        if: runner.os != 'Windows'
        run: ../scripts/setup.sh

      - name: Set up framewise again, to prove re-running is safe
        if: runner.os != 'Windows'
        run: ../scripts/setup.sh

      - name: Set up framewise (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ../scripts/setup.ps1

      - name: Set up framewise again, to prove re-running is safe (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ../scripts/setup.ps1

      - name: Put ExifTool on the PATH of later steps (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:Path = [Environment]::GetEnvironmentVariable('Path', 'Machine') + ';' + [Environment]::GetEnvironmentVariable('Path', 'User')
          Split-Path (Get-Command exiftool).Source | Add-Content $env:GITHUB_PATH

      - name: Test the Review UI
        if: runner.os == 'Linux'
        working-directory: frontend
        run: npx ng test --watch=false

      - name: Check the portable Providers are available (Linux and Windows)
        if: runner.os != 'macOS'
        run: |
          uv run python -c "import framewise.mediapipe_faces as m; assert m.MediaPipeFaceDetection().is_available()"
          uv run python -c "import framewise.dinov2_fingerprint as d; assert d.DinoV2Fingerprint().is_available()"
          uv run python -c "import framewise.ediffiqa_face_quality as e; assert e.EDifFIQAFaceQuality().is_available()"

      - run: uv run ruff check

      - run: uv run ruff format --check

      - run: uv run pytest

  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build the wheel, with the Review UI inside
        working-directory: backend
        run: uv build --wheel

      - name: Run the wheel in a clean Linux container with only ExifTool
        run: |
          docker run --rm \
            --volume "$PWD:/repo:ro" \
            --volume "$(command -v uv):/usr/local/bin/uv:ro" \
            --volume "$(command -v uvx):/usr/local/bin/uvx:ro" \
            --workdir /repo \
            debian:trixie-slim \
            bash -c 'apt-get update &&
              apt-get install --yes --no-install-recommends libimage-exiftool-perl curl ca-certificates &&
              scripts/smoke-test-wheel.sh backend/dist/*.whl'
