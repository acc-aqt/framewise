name: CI

on:
  pull_request:
  push:
    branches: [main, "epic/**"]

jobs:
  backend:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Lint the setup script
        if: runner.os == 'Linux'
        run: shellcheck ../scripts/setup.sh

      - name: Set up framewise
        run: ../scripts/setup.sh

      - name: Set up framewise again, to prove re-running is safe
        run: ../scripts/setup.sh

      - name: Test the Review UI
        if: runner.os == 'Linux'
        working-directory: frontend
        run: npx ng test --watch=false

      - name: Check the portable Providers are available (Linux)
        if: runner.os == 'Linux'
        run: |
          uv run python -c "import framewise.mediapipe_faces as m; assert m.MediaPipeFaceDetection().is_available()"
          uv run python -c "import framewise.dinov2_fingerprint as d; assert d.DinoV2Fingerprint().is_available()"

      - run: uv run ruff check

      - run: uv run ruff format --check

      - run: uv run pytest
