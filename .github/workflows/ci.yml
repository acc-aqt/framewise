name: CI

on:
  pull_request:
  push:
    branches: [main, "epic/**"]

permissions:
  contents: read

jobs:
  backend:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Lint the setup script
        if: runner.os == 'Linux'
        run: shellcheck ../scripts/setup.sh

      - name: Set up framewise
        run: ../scripts/setup.sh

      - name: Set up framewise again, to prove re-running is safe
        run: ../scripts/setup.sh

      - name: Test the Review UI
        if: runner.os == 'Linux'
        working-directory: frontend
        run: npx ng test --watch=false

      - name: Check the portable Providers are available (Linux)
        if: runner.os == 'Linux'
        run: |
          uv run python -c "import framewise.mediapipe_faces as m; assert m.MediaPipeFaceDetection().is_available()"
          uv run python -c "import framewise.dinov2_fingerprint as d; assert d.DinoV2Fingerprint().is_available()"

      - run: uv run ruff check

      - run: uv run ruff format --check

      - run: uv run pytest
