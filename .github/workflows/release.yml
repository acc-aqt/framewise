name: Release

# Publishes a Release's wheel (ADR-0010): attaches it to the GitHub
# Release and uploads it to PyPI as framewise-cull. scripts/release.sh
# creates the GitHub Release, which starts this.
#
# Running it by hand is the dry run: it builds and tests the wheel from a
# branch or tag and says what a Release would publish, but publishes nothing.
#
# One-time setup, by hand, before the first Release that publishes:
#   1. On GitHub, create the environment "pypi" (Settings > Environments),
#      optionally with required reviewers so each upload waits for approval.
#   2. On PyPI, add a pending trusted publisher for the project
#      "framewise-cull" (Your account > Publishing): owner acc-aqt,
#      repository framewise, workflow release.yml, environment pypi.
#      The first upload creates the project.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: Branch or tag to build the wheel from. Nothing is published.
        default: main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.ref }}
          persist-credentials: false

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: frontend/.nvmrc

      - name: Check the version matches the Release's tag
        id: version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="$(sed -n -E 's/^version = "(.*)"$/\1/p' backend/pyproject.toml | head -n 1)"
          if [[ -n "$TAG" && "$TAG" != "v$version" ]]; then
            echo "::error::The Release is $TAG, but backend/pyproject.toml says $version."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build the wheel, with the Review UI inside
        working-directory: backend
        run: uv build --wheel

      - name: Check the wheel carries the Review UI and the Changelog
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          wheel="backend/dist/framewise_cull-$VERSION-py3-none-any.whl"
          [[ -f "$wheel" ]] || { echo "::error::No wheel at $wheel."; exit 1; }
          contents="$(unzip -Z1 "$wheel")"
          grep -qx 'framewise/review_ui/index.html' <<< "$contents" || { echo "::error::The wheel has no Review UI."; exit 1; }
          grep -qx 'framewise/CHANGELOG.md' <<< "$contents" || { echo "::error::The wheel has no Changelog."; exit 1; }

      - name: Run the wheel in a clean Linux container with only ExifTool
        run: |
          docker run --rm \
            --volume "$PWD:/repo:ro" \
            --volume "$(command -v uv):/usr/local/bin/uv:ro" \
            --volume "$(command -v uvx):/usr/local/bin/uvx:ro" \
            --workdir /repo \
            debian:trixie-slim \
            bash -c 'apt-get update &&
              apt-get install --yes --no-install-recommends libimage-exiftool-perl curl ca-certificates &&
              scripts/smoke-test-wheel.sh backend/dist/*.whl'

      - name: Say what is published
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          wheel="framewise_cull-$VERSION-py3-none-any.whl"
          if [[ -n "$TAG" ]]; then
            intro="This Release publishes"
          else
            intro="Dry run, nothing is published. A Release of this commit as v$VERSION would publish"
          fi
          {
            echo "$intro \`$wheel\`, SHA-256 \`$(sha256sum "backend/dist/$wheel" | cut -d ' ' -f 1)\`:"
            echo
            echo "- attached to the GitHub Release v$VERSION"
            echo "- uploaded to PyPI as framewise-cull $VERSION"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: wheel
          path: backend/dist/*.whl
          if-no-files-found: error

  github-release:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: wheel
          path: dist

      - name: Attach the wheel to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" dist/*.whl --repo "$GITHUB_REPOSITORY" --clobber

  pypi:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/framewise-cull/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: wheel
          path: dist

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: false

      - name: Upload the wheel to PyPI with trusted publishing
        run: uv publish --trusted-publishing always dist/*.whl

  check-pypi:
    needs: [build, pypi]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: false

      - name: Wait until PyPI serves the version
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          for _ in $(seq 60); do
            curl --silent --fail "https://pypi.org/simple/framewise-cull/" | grep -q "framewise_cull-$VERSION-py3-none-any.whl" && exit 0
            sleep 10
          done
          echo "::error::PyPI does not list framewise-cull $VERSION after 10 minutes."
          exit 1

      - name: Run the published version in a clean Linux container with only ExifTool
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          docker run --rm \
            --env VERSION \
            --volume "$PWD:/repo:ro" \
            --volume "$(command -v uv):/usr/local/bin/uv:ro" \
            --volume "$(command -v uvx):/usr/local/bin/uvx:ro" \
            --workdir /repo \
            debian:trixie-slim \
            bash -c 'apt-get update &&
              apt-get install --yes --no-install-recommends libimage-exiftool-perl curl ca-certificates &&
              scripts/smoke-test-wheel.sh --pypi "$VERSION"'
