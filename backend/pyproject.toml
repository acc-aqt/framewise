[project]
name = "framewise"
version = "0.1.0"
description = "Cull a photo Session: scan Frames and review them locally."
authors = [
    { name = "alexander-carrels" }
]
license = "MIT"
requires-python = ">=3.13,<3.15"
dependencies = [
    "fastapi>=0.162.7",
    "pillow>=13.0.0",
    "pyobjc-framework-vision>=11 ; sys_platform == 'darwin'",
    "send2trash>=2.2.0",
    "uvicorn>=0.54.0",
]

[project.optional-dependencies]
portable = [
    "mediapipe>=1.2.3",
    "onnxruntime>=1.32.0",
]

[project.scripts]
framewise = "framewise.cli:main"
framewise-benchmark = "framewise.benchmark:main"

[project.entry-points."framewise.providers"]
apple-vision-fingerprint = "framewise.apple_vision:AppleFingerprint"
apple-vision-face-detection = "framewise.apple_vision:AppleFaceDetection"
apple-vision-eye-state = "framewise.apple_vision:AppleEyeState"
apple-vision-face-quality = "framewise.apple_vision:AppleFaceQuality"
apple-vision-aesthetics = "framewise.apple_vision:AppleAesthetics"
mediapipe-face-detection = "framewise.mediapipe_faces:MediaPipeFaceDetection"
mediapipe-eye-state = "framewise.mediapipe_faces:MediaPipeEyeState"
dinov2-small-fingerprint = "framewise.dinov2_fingerprint:DinoV2Fingerprint"

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/framewise"]

[tool.hatch.build.hooks.custom]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
