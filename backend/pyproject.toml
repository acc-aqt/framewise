[project]
name = "framewise"
version = "0.1.0"
description = "Cull a photo Session: scan Frames and review them locally."
authors = [
    { name = "alexander-carrels", email = "alexander.carrels@outlook.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.162.7",
    "pillow>=13.0.0",
    "pyobjc-framework-vision>=11 ; sys_platform == 'darwin'",
    "uvicorn>=0.54.0",
]

[project.scripts]
framewise = "framewise.cli:main"
framewise-benchmark = "framewise.benchmark:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
