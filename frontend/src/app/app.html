<header>
  <h1>framewise</h1>
  @if (summary.hasValue()) {
    <p class="root">{{ summary.value().root }}</p>
    <app-session-summary [summary]="summary.value()" />
  } @else if (summary.error()) {
    <p class="error">Could not load the Session.</p>
  }
</header>
<main>
  @if (frames.error()) {
    <p class="error">Could not load the Frames.</p>
  } @else {
    <app-frame-grid [frames]="frames.value()" />
  }
</main>
